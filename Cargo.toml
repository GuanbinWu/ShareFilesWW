[package]
name = "ShareFilesWW"
version = "0.3.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-util = "0.7"
warp="0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json="1.0"
parking_lot="0.12"
bytes={version="1.12",features=["serde"]}
sqlx = { version = "0.9", features = [ "runtime-tokio","postgres","chrono" ] }
rand="0.8"
rust-argon2="1.0"
paseto="2.0"
clap = { version = "4.6.1", features = ["derive"] }
chrono="0.4.19"
mime_guess="2.0"
md5="0.8"
base64 = "0.22"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
walkdir = "2"
sysinfo = "0.30"
uuid = { version = "0.8", features = ["serde", "v4"] }
infer = "0.15"
percent-encoding="2"
dotenv = "0.15.0"
job_scheduler = "1.2.1"
